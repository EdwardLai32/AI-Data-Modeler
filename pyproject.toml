[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "automl-architect"
version = "0.1.0"
description = "An autonomous multi-agent AI data scientist: profiles data, plans a pipeline, trains and evaluates models, and explains every decision."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AutoML Architect" }]
keywords = ["automl", "agents", "claude", "data-science", "machine-learning", "explainability"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  "anthropic>=0.116",
  "pandas>=2.1",
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "pyarrow>=14",
  "openpyxl>=3.1",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "SQLAlchemy>=2.0",
  "duckdb>=0.10",
  "jinja2>=3.1",
  "typer>=0.12",
  "rich>=13.7",
  "python-dotenv>=1.0",
  "joblib>=1.3",
  "statsmodels>=0.14",
  "plotly>=5.20",
]

[project.optional-dependencies]
boost = ["xgboost>=2.0", "lightgbm>=4.3", "catboost>=1.2"]
tuning = ["optuna>=3.6"]
explain = ["shap>=0.45"]
charts = ["kaleido>=0.2.1"]
reports = ["reportlab>=4.1", "python-pptx>=0.6.23", "markdown>=3.6"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "sse-starlette>=2.1", "httpx>=0.27"]
sql = ["psycopg[binary]>=3.1", "PyMySQL>=1.1"]
snowflake = ["snowflake-sqlalchemy>=1.5"]
databricks = ["databricks-sql-connector>=3.1"]
cloud = ["boto3>=1.34", "azure-storage-blob>=12.19", "google-cloud-storage>=2.16", "s3fs>=2024.3"]
kaggle = ["kaggle>=1.6"]
mlflow = ["mlflow>=2.12"]
dev = ["pytest>=8.1", "pytest-asyncio>=0.23", "pytest-cov>=5.0", "ruff>=0.4", "mypy>=1.9"]
all = [
  "automl-architect[boost,tuning,explain,charts,reports,api,sql,cloud,kaggle]",
]

[project.scripts]
automl-architect = "automl_architect.cli:app"
amla = "automl_architect.cli:app"

[tool.setuptools.packages.find]
include = ["automl_architect*"]

[tool.setuptools.package-data]
automl_architect = [
  "reporting/templates/*.html",
  "reporting/templates/*.j2",
  "reporting/templates/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "live: hits the real Anthropic API; requires credentials and costs money",
  "slow: takes more than a few seconds",
]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "B008", "RUF012"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
